# The lab's known-good profiles for the Icom IC-7300: one per program, the
# same for every IC-7300 the lab has enrolled (brian's decision,
# 2026-10-28: per model, locked, and only an administrator replaces them,
# by changing this file in a new build of the Agent). The Agent puts a
# program's profile on an enrolled radio once, as that program starts
# (Principle X, second exception). It never saves the radio over these.
#
# Each setting is a setting id from rigs/icom/ic-7300.toml and the bytes the
# radio sends and takes for it, in hex. The Agent writes only settings the
# definition marks as checked on a real radio (write_checked).

maker = "Icom"
model = "IC-7300"

[[profiles]]
name = "VARA"
source = "brian, K9KSU, at FieldLab, 2026-10-28 and 2026-10-29: the kept VARA setup of the first VarAC/VARA contact (DATA-USB on FIL1, FIL1 2.3 kHz, FIL2 1.2 kHz, FIL3 500 Hz, USB MOD Level 40%), with DATA MOD on USB so VARA's audio is what transmits."

# USB (mode code 01) on FIL1. Written first: choosing the mode turns data
# mode off on Icom radios, so the data mode goes second.
[[profiles.settings]]
id = "mode_and_filter"
bytes = "01 01"

# DATA mode on (D1), FIL1: DATA-USB.
[[profiles.settings]]
id = "data_mode_and_filter"
bytes = "01 01"

# The selected filter's width, step 27: SSB steps 10 to 40 are 600 Hz to
# 3.6 kHz in 100 Hz steps, so 27 is 2.3 kHz. Written once DATA-USB FIL1 is
# selected, so it lands on FIL1.
[[profiles.settings]]
id = "filter_width"
bytes = "27"

# USB MOD Level 102 of 255: 40%.
[[profiles.settings]]
id = "usb_mod_level"
bytes = "01 02"

# DATA MOD: USB (03h), the computer's audio.
[[profiles.settings]]
id = "data_mod"
bytes = "03"

[[profiles]]
name = "fldigi"
source = "Claude for brian, 2026-10-29, a starting point for brian to confirm at FieldLab: the VARA profile above (DATA-USB FIL1 2.3 kHz, USB MOD Level 40%, DATA MOD USB, all set by brian at the radio), plus AGC FAST and NB, NR and both notches off, as K0PIR gives for PSK and RTTY on the IC-7300 (k0pir.us/icom-7300-receiver-settings, k0pir.us/transmitter-settings-digital-operation)."

# USB (mode code 01) on FIL1, then DATA on: DATA-USB, as for VARA.
[[profiles.settings]]
id = "mode_and_filter"
bytes = "01 01"

[[profiles.settings]]
id = "data_mode_and_filter"
bytes = "01 01"

# FIL1 2.3 kHz (step 27), written once DATA-USB FIL1 is selected.
[[profiles.settings]]
id = "filter_width"
bytes = "27"

# AGC FAST (01h). Written after the mode, so it lands on DATA-USB.
[[profiles.settings]]
id = "agc"
bytes = "01"

# Noise blanker, noise reduction, auto notch and manual notch all off
# (00h), as K0PIR has them for digital modes.
[[profiles.settings]]
id = "noise_blanker"
bytes = "00"

[[profiles.settings]]
id = "noise_reduction"
bytes = "00"

[[profiles.settings]]
id = "auto_notch"
bytes = "00"

[[profiles.settings]]
id = "manual_notch"
bytes = "00"

# USB MOD Level 102 of 255: 40%.
[[profiles.settings]]
id = "usb_mod_level"
bytes = "01 02"

# DATA MOD: USB (03h), the computer's audio.
[[profiles.settings]]
id = "data_mod"
bytes = "03"
