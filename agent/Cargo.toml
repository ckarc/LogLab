[package]
name = "loglab-agent"
version = "0.1.0"
description = "LabLog Station Agent: owns the radios and shares them through one common rig model."
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
authors = ["Brian Krenzin, K9KSU"]
repository = "https://github.com/ckarc/loglab"
publish = false
default-run = "loglab-agent"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
# A radio's COM port, for the CI-V driver. No default features: they only
# add USB device listing through libudev on Linux, which needs system
# libraries. MPL-2.0.
serialport = { version = "4.10.1", default-features = false }
serde_json = "1"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

# Sound devices, for routing a radio's audio. Windows only for now: FieldLab's
# workstations are Windows, and Linux's backend needs system ALSA libraries.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", default-features = false }
# The tray: its icon by the clock, menu and notices (Windows'
# Shell_NotifyIconW and popup menus). MIT.
native-windows-gui = { version = "1.0.13", default-features = false, features = ["tray-notification", "message-window", "menu", "cursor", "notice"] }
# Windows' own message box, kept on top until answered (MB_TOPMOST), and
# which program owns a connection to the virtual radio (GetExtendedTcpTable,
# QueryFullProcessImageNameW). Already in the build through cpal. MIT OR
# Apache-2.0.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# `unsafe` is denied (not forbidden) so a hardware or platform interface that
# truly needs it can allow it locally — isolated, documented, and justified in
# the pull request, per the constitution's Station Agent constraints.
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
