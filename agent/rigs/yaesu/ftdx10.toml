# Rig definition: Yaesu FTDX10.
#
# The first Yaesu CAT definition. The format is the IC-7300's (described in
# docs/station-agent-usb-radios.md, "Rig definition files") with what CAT
# needs: commands are written as they are sent, without the semicolon
# ("RG0"); a menu item is its group, page and item ("01 04 17" is
# EX010417); and `digits` says how many digits a value has on the wire. The
# Agent keeps a value of digits as BCD bytes, as an Icom radio sends its
# values: RG0255; is kept as 02 55.
#
# Nothing here has been checked on a real FTDX10. Every value is
# `verified = false` and no setting has `write_checked`, so the Agent reads
# and records this radio's settings but writes none until
# `loglab-agent check-writes` has been run on a real FTDX10.
#
# Menu group 05 (the clock, memory and menu loads and saves, firmware
# update, format, calibration and resets) is left out: the Agent never
# touches it.

[definition]
schema = 1
maker = "Yaesu"
model = "FTDX10"
family = "yaesu-cat"
status = "draft"

[[definition.sources]]
id = "cat_manual"
title = "Yaesu FTDX10 CAT operation reference manual, as hosted at rigpix.com/yaesu/ftdx10_cat_manual.pdf"
note = """
The command table (ID, FA, FB, MD, TX, RM, VS, ST, and every front-panel
command below), the EX menu (Table 2: groups 01 to 05) and the width table
(Table 3) were read from a text copy of this manual, 2026-10-29. The manual
lists the USB ports: the Enhanced COM Port carries CAT, the Standard COM Port
the transmit controls (PTT, CW keying, digital modes). It doesn't give data
bits, stop bits or parity, or how the radio answers a command it can't do.
"""

[[definition.sources]]
id = "hamlib_ftdx10"
title = "Hamlib rigs/yaesu/ftdx10.c, ftdx10.h and newcat.c (github.com/Hamlib/Hamlib, master, read 2026-10-29)"
note = """
Used only for what the manual doesn't say; nothing was copied from it
(Principle XVI). ftdx10.c: 4800 to 38400 baud, 8 data bits, 2 stop bits,
hardware handshake. ftdx10.h: the Po meter at 27, 94, 147, 176 and 205 is 5,
25, 50, 75 and 100 W, and SWR at 0, 26, 52, 89, 126, 173 and 236 is 1.0,
1.2, 1.5, 2.0, 3.0, 4.0 and 5.0 (measured on an FTDX101D, says the file).
newcat.c: the mode characters (3 CW, 7 CW-R, 6 RTTY, 9 RTTY-R, 8 PKTLSB,
C PKTUSB, A PKTFM), and an answer of ?; as the radio refusing a command.
"""

[[definition.sources]]
id = "usb_ids"
title = "Silicon Labs CP2105 at 10C4:EA70 in FTDX10s (the FT8AF project's issue 817, as noted 2026-10-27), and the CP2105's two interfaces"
note = """
The radio's USB serial bridge is one CP2105 with two ports: interface 0, the
Enhanced COM Port (CAT), and interface 1, the Standard COM Port (transmit
controls). Which interface is which is not checked on a radio.
"""

[[definition.sources]]
id = "silabs_driver"
title = "Silicon Labs, CP210x Universal Windows Driver release notes (11.6.0, 2026-09-15), silabs.com/documents/public/release-notes/CP210x_Universal_Windows_Driver_ReleaseNotes.txt"
note = "Lists the CP2105 among the devices it supports: the same driver as the IC-7300's."

# ---------------------------------------------------------------------------
# How the radio appears on USB.
# ---------------------------------------------------------------------------
[usb]
audio = { name_contains = "USB Audio CODEC", verified = false }

# One CP2105 with two ports. The Standard COM Port keys the transmitter from
# its RTS or DTR line (the RPTT SELECT and PC KEYING items below), so the
# Agent never opens it: it opens only interface 0, the Enhanced COM Port.
[usb.serial]
vid = 0x10C4
pid = 0xEA70
role = "cat"
interface = 0
verified = false

[usb.serial.driver]
name = "Silicon Labs CP210x"
download = "https://www.silabs.com/documents/public/software/CP210x_Universal_Windows_Driver.zip"
page = "https://www.silabs.com/developers/usb-to-uart-bridge-vcp-drivers"
file = "CP210x_Universal_Windows_Driver.zip"
inf = "silabser.inf"
source = "silabs_driver"
verified = false

# ---------------------------------------------------------------------------
# The CAT link: 4800 to 38400 baud (CAT RATE, EX030108), 8 data bits, 2 stop
# bits (Hamlib). RTS is held on: with CAT RTS (EX030110) enabled the radio
# uses it for flow control, and on the Enhanced port it can't key the radio.
# DTR stays off.
# ---------------------------------------------------------------------------
[link]
baud_rates = [38400, 9600, 19200, 4800]
stop_bits = 2
rts = "on"
echo = "off"
verified = false

[identity]
# ID; answers ID0761;.
query = "ID"
answer = "0761"
source = "cat_manual"
verified = false

# ---------------------------------------------------------------------------
# Modes: the character MD0; answers, by rig-model mode. CW-U is CW and CW-L
# is CW-R, RTTY-L is RTTY and RTTY-U is RTTY-R (Hamlib newcat.c). FM-N, AM-N,
# PSK and DATA-FM-N have no rig-model name yet.
# ---------------------------------------------------------------------------
[modes]
source = "cat_manual"
verified = false

[modes.codes]
LSB = 0x31
USB = 0x32
CW = 0x33
FM = 0x34
AM = 0x35
RTTY = 0x36
CW-R = 0x37
DATA-LSB = 0x38
RTTY-R = 0x39
DATA-FM = 0x41
DATA-USB = 0x43

# ---------------------------------------------------------------------------
# Commands the driver uses for rig-model operations, as sent without their
# semicolons. The driver adds the values.
# ---------------------------------------------------------------------------
[commands]
read_frequency = { command = "FA", source = "cat_manual", verified = false }
set_frequency = { command = "FA", source = "cat_manual", verified = false }
read_mode = { command = "MD0", source = "cat_manual", verified = false }
set_mode = { command = "MD0", source = "cat_manual", verified = false }
vfo_frequency = { command = "FB", source = "cat_manual", verified = false }
select_vfo_a = { command = "VS0", source = "cat_manual", verified = false }
select_vfo_b = { command = "VS1", source = "cat_manual", verified = false }
split = { command = "ST", off = 0x30, on = 0x31, source = "cat_manual", verified = false }
# TX1; is CAT TX on, TX0; off. Only the Agent's transmit path may send them
# (Principle XI).
ptt = { command = "TX", off = 0x30, on = 0x31, source = "cat_manual", verified = false }

# ---------------------------------------------------------------------------
# Every setting the radio exposes over CAT: the EX menu, groups 01 to 04, then
# the front-panel controls. A setting with signed or text values ("+05", a
# call sign) is kept raw as the characters the radio sends. `write = false`:
# the CAT and RS-232C link, and the lines that key the radio.
# ---------------------------------------------------------------------------
