# ---------------------------------------------------------------------------
# The transmit meters: RM5 Po, RM6 SWR, RM4 ALC, each 000 to 255 (manual).
# Po and SWR points are Hamlib's (ftdx10.h); the manual gives no scale for
# ALC, so its 0 to 255 is read as 0 to 100% of the meter.
# ---------------------------------------------------------------------------
[meters]
source = "hamlib_ftdx10"
# Watts of 100: percent.
power = [[0, 0], [27, 5], [94, 25], [147, 50], [176, 75], [205, 100]]
swr = [[0, 10], [26, 12], [52, 15], [89, 20], [126, 30], [173, 40], [236, 50]]
alc = [[0, 0], [255, 100]]
# DATA modes take the Agent's audio from USB (REAR SELECT USB), at RPORT GAIN.
drive = "data_rport_gain"
power_setting = "rf_power"

# ---------------------------------------------------------------------------
# Requirements.
# ---------------------------------------------------------------------------
[[requirements]]
job = "digital_modes"
setting = "data_mod_source"
accept = ["REAR"]
offer = "REAR"
explain = "In the DATA modes the radio takes transmit audio from the microphone, so programs like WSJT-X and VARA would transmit silence. Set DATA MOD SOURCE to REAR."

[[requirements]]
job = "digital_modes"
setting = "data_rear_select"
accept = ["USB"]
offer = "USB"
explain = "In the DATA modes the radio takes rear-panel audio from the DATA jack, not USB, so programs like WSJT-X and VARA would transmit silence. Set DATA REAR SELECT to USB."
