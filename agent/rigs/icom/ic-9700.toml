# Rig definition: Icom IC-9700.
#
# The IC-9700 speaks the same CI-V protocol as the IC-7300 (Icom's IC-9700
# CI-V reference guide), so it uses the same driver; this file says where
# it differs: its address (A2h), its menu (342 items, numbered differently
# from the IC-7300's), and its two USB serial ports. The format is described
# in docs/station-agent-usb-radios.md ("Rig definition files").
#
# Nothing here has been checked on a real IC-9700 yet. Every value is
# `verified = false`, and no setting has `write_checked`, so the Agent reads
# and records this radio's settings but never writes one until
# `loglab-agent check-writes` has been run on a real IC-9700 and its
# evidence added here, as was done for the IC-7300.
#
# Front-panel commands act on the band the radio has selected, MAIN or SUB
# (07 D0 / 07 D1). The Agent leaves that choice to the operator.
#
# All bytes are written in hexadecimal, as the CI-V documents write them.

[definition]
schema = 1
maker = "Icom"
model = "IC-9700"
family = "icom-civ"
status = "draft"

[[definition.sources]]
id = "civ_guide"
title = "Icom IC-9700 CI-V reference guide (second edition), as hosted at rigpix.com/icom/ic9700_civ_v2.pdf"
note = """
The command table (03 to 26), the 1A 05 menu items 0001 to 0342, the mode
and filter codes (04/06), 1A 03 filter widths, 1A 06 data mode, and the 15 11,
15 12 and 15 13 meter scales were read from a text copy of this guide,
2026-10-29. Item numbers 0029, 0100, 0105, 0106, 0110, 0127, 0152, 0167,
0179, 0180, 0184, 0192, 0227 and 0330 agree with Hamlib's
rigs/icom/ic7300.c (ic9700_extcmds, ic9700_clock_cmds), read the same day
only to cross-check the numbering; nothing was copied from it (Principle
XVI). Menu items are kept raw (compared and put back as the bytes the radio
sends) except where the meanings matter to the Agent's jobs.
"""

[[definition.sources]]
id = "satpc32_guide"
title = "AMSAT, SatPC32 and IC-9700 setup (amsat.org/wordpress/wp-content/uploads/2020/01/SatPC32-IC9700-Setup-1.pdf)"
note = """
On Windows the radio's USB brings up two Silicon Labs CP210x USB to UART
Bridge ports, the lower-numbered one for control; the radio's default CI-V
address is A2h; CI-V USB Baud Rate 115200.
"""

[[definition.sources]]
id = "usb_serial_strings"
title = "IC-9700 USB serial numbers in udev rules posted on cqrlog.com/node/2278 and forum.wfview.org (topic 2805)"
note = """
Both of the radio's USB serial ports are Silicon Labs CP2102N bridges at
10C4:EA60, with USB serial numbers "IC-9700 <number> A" and
"IC-9700 <number> B". The guide's USB SEND item names them USB (A) and
USB (B); CI-V is on USB (A). How Windows spells the number (spaces or
underscores) is not verified.
"""

[[definition.sources]]
id = "silabs_driver"
title = "Silicon Labs, CP210x Universal Windows Driver release notes (11.6.0, 2026-09-15), silabs.com/documents/public/release-notes/CP210x_Universal_Windows_Driver_ReleaseNotes.txt"
note = "Lists the CP2102N among the devices it supports: the same driver as the IC-7300's."

# ---------------------------------------------------------------------------
# How the radio appears on USB.
# ---------------------------------------------------------------------------
[usb]
audio = { name_contains = "USB Audio CODEC", verified = false }

# Two CP2102N bridges at 10C4:EA60. Only USB (A) carries CI-V. USB (B)
# carries DV data, GPS or RTTY decode (menu item 0132), and in DV mode with
# DV Data TX on Auto (item 0076) the radio transmits what arrives there, so
# the Agent must never write to it: it opens only the port whose USB serial
# number ends in A.
[usb.serial]
vid = 0x10C4
pid = 0xEA60
role = "civ"
number_ends_with = "A"
verified = false

[usb.serial.driver]
name = "Silicon Labs CP210x"
download = "https://www.silabs.com/documents/public/software/CP210x_Universal_Windows_Driver.zip"
page = "https://www.silabs.com/developers/usb-to-uart-bridge-vcp-drivers"
file = "CP210x_Universal_Windows_Driver.zip"
inf = "silabser.inf"
source = "silabs_driver"
verified = false

# ---------------------------------------------------------------------------
# The CI-V link.
# ---------------------------------------------------------------------------
[link]
default_address = 0xA2
controller_address = 0xE0
baud_rates = [115200, 19200, 9600, 38400, 57600, 4800]
# Whether the radio echoes each command back depends on item 0130; the
# driver detects echo on the wire either way.
echo = "detect"
verified = false

[identity]
# Read the transceiver ID. The radio answers with its CI-V address.
query = "19 00"
source = "civ_guide"
verified = false

# ---------------------------------------------------------------------------
# Modes (04, 06, 26). The guide also lists DV (17) and DD (22), which the rig
# model has no name for yet, so the Agent reports them as unknown.
# ---------------------------------------------------------------------------
[modes]
source = "civ_guide"
verified = false

[modes.codes]
LSB = 0x00
USB = 0x01
AM = 0x02
CW = 0x03
RTTY = 0x04
FM = 0x05
CW-R = 0x07
RTTY-R = 0x08

[data_mode]
# 1A 06: data mode off (00) or on (01), then the filter (01, 02, 03; 00 when off).
command = "1A 06"
data_modes = { DATA-USB = "USB", DATA-LSB = "LSB", DATA-FM = "FM" }
source = "civ_guide"
verified = false

# ---------------------------------------------------------------------------
# Commands the driver uses for rig-model operations. In satellite mode
# 07 01 (VFO B) is refused, and 25 / 26 reach the MAIN band only (guide).
# ---------------------------------------------------------------------------
[commands]
read_frequency = { command = "03", source = "civ_guide", verified = false }
read_mode = { command = "04", source = "civ_guide", verified = false }
set_frequency = { command = "05", source = "civ_guide", verified = false }
set_mode = { command = "06", source = "civ_guide", verified = false }
vfo_frequency = { command = "25", source = "civ_guide", verified = false }
vfo_mode = { command = "26", source = "civ_guide", verified = false }
select_vfo_a = { command = "07 00", source = "civ_guide", verified = false }
select_vfo_b = { command = "07 01", source = "civ_guide", verified = false }
split = { command = "0F", off = 0x00, on = 0x01, source = "civ_guide", verified = false }
# 1C 00: transmit status. 00 = receive, 01 = transmit.
# Writing this keys the radio: only the Agent's transmit path may use it
# (Principle XI).
ptt = { command = "1C 00", off = 0x00, on = 0x01, source = "civ_guide", verified = false }

