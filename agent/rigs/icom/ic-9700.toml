# ---------------------------------------------------------------------------
# What the transmit meters (15 11 Po, 15 12 SWR, 15 13 ALC) mean: the same
# scale points as the IC-7300's (guide). The IC-9700 has no antenna tuner,
# so there is no tuner question.
# ---------------------------------------------------------------------------
[meters]
source = "civ_guide"
# 00 00 = 0%, 01 43 = 50%, 02 13 = 100%.
power = [[0, 0], [143, 50], [213, 100]]
# 00 00 = SWR 1.0, 00 48 = 1.5, 00 80 = 2.0, 01 20 = 3.0; in tenths.
swr = [[0, 10], [48, 15], [80, 20], [120, 30]]
# 00 00 = minimum, 01 20 = maximum; as percent of the scale.
alc = [[0, 0], [120, 100]]
drive = "usb_mod_level"
power_setting = "rf_power"

# ---------------------------------------------------------------------------
# Requirements: settings a job can't work without.
# ---------------------------------------------------------------------------
[[requirements]]
job = "digital_modes"
setting = "data_mod"
accept = ["USB", "MIC,USB"]
offer = "USB"
explain = "In data mode the radio takes transmit audio from somewhere other than USB, so programs like WSJT-X and VARA would transmit silence."

[[requirements]]
job = "computer_voice"
setting = "data_off_mod"
accept = ["USB", "MIC,USB"]
offer = "MIC,USB"
explain = "Outside data mode the radio doesn't take transmit audio from USB, so a program's voice keyer would transmit silence. MIC,USB keeps the microphone working too."
