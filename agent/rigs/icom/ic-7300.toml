# Rig definition: Icom IC-7300.
#
# The first rig definition file, and the model for the rest. The format is
# described in docs/station-agent-usb-radios.md ("Rig definition files").
# This file is data, never code (Principle XII): the Agent checks it against
# the schema when it loads it.
#
# `verified = true` means a value was checked against a real IC-7300. The
# Agent reads unverified settings but never writes them. Every value below
# starts unverified; flip each one only after checking it on a radio, and say
# which firmware in the pull request.
#
# All bytes are written in hexadecimal, as the CI-V documents write them.

[definition]
schema = 1
maker = "Icom"
model = "IC-7300"
family = "icom-civ"
status = "draft"

[[definition.sources]]
id = "full_manual"
title = "Icom IC-7300 Full Manual, section 19: Control command (CI-V)"
note = "Command 19 00, 1A 05 settings, 1A 06, 1C 00, 25 and 26 were read from this section."

[[definition.sources]]
id = "civ_common"
title = "Icom CI-V command set as used across Icom HF radios"
note = """
Commands 03, 04, 05, 06, 07 and 0F were not in the part of the manual read for
this file. They are written from the common Icom CI-V command set and must be
checked against the full manual and a radio before they are marked verified.
"""

[[definition.sources]]
id = "manual_copy"
title = "IC-7300 manual, section 19 (control command), pages 19-3 to 19-13, as copied at radio.pk2.se/article/IC-7300-CAT-commands.pdf"
note = """
An OCR copy of the manual's command table. Menu items 0001 to 0100 and the
front-panel commands marked with this source were read row by row from it,
2026-10-27. Where a row was garbled, the setting is kept raw, as the bytes
the radio sends, rather than guessed.
"""

[[definition.sources]]
id = "manual_copy_summary"
title = "The same copy, items 0101 to 0195, read as a condensed list"
note = """
Only the labels came from this reading, not the values, so every one of these
settings is kept raw: the Agent stores and compares the bytes the radio sends
without saying what they mean.
"""

[[definition.sources]]
id = "info_v140"
title = "Icom, INFORMATION IC-7300 Version 1.40 (firmware 1.30 and 1.40 additions), k0pir.us/wp-content/uploads/2021/03/IC-7300_ENG_Info_V140_0.pdf"
note = "Menu items 0196 and 0198 to 0216, which earlier manuals don't have. Kept raw."

[[definition.sources]]
id = "hamlib_wfview"
title = "Front-panel commands not in the copy read: Hamlib rigs/icom/icom_defs.h and ic7300.c, and wfview rigs/IC-7300.rig"
note = """
Used only to say which command reads which control and over what range;
nothing was copied from either (Principle XVI). Check each against Icom's
CI-V reference guide and a radio before marking it verified. Where neither
says what the values mean, the setting is kept raw.
"""

# ---------------------------------------------------------------------------
# How the radio appears on USB.
# ---------------------------------------------------------------------------
[usb]
# The radio holds a USB hub with a USB-to-serial bridge and a USB sound device
# behind it. The Agent pairs the two by their shared parent in the device tree.
# 10C4:EA60 is Silicon Labs' standard ID for its CP210x serial bridges.
serial = { vid = 0x10C4, pid = 0xEA60, role = "civ", verified = false }
audio = { name_contains = "USB Audio CODEC", verified = false }

# ---------------------------------------------------------------------------
# The CI-V link.
# ---------------------------------------------------------------------------
[link]
default_address = 0x94
controller_address = 0xE0
# The speed of the USB port can't be read or set over CI-V, so the Agent tries
# these in order until the radio answers the identity query.
baud_rates = [115200, 19200, 9600, 38400, 57600, 4800]
# Whether the radio echoes each command back depends on setting 0075 (below);
# the driver detects echo on the wire either way.
echo = "detect"
verified = false

[identity]
# Read the transceiver ID. The radio answers with its CI-V address.
query = "19 00"
source = "full_manual"
verified = false

# ---------------------------------------------------------------------------
# Modes: the radio's mode byte (commands 04, 06, 26) mapped to the rig model.
# Data modes are the voice mode with data mode on (command 1A 06), so
# USB with data on is DATA-USB.
# ---------------------------------------------------------------------------
[modes]
source = "full_manual"
verified = false

[modes.codes]
LSB = 0x00
USB = 0x01
AM = 0x02
CW = 0x03
RTTY = 0x04
FM = 0x05
CW-R = 0x07
RTTY-R = 0x08

[data_mode]
# 1A 06: data mode off (00) or on (01), then the filter (01, 02, 03; 00 when off).
command = "1A 06"
data_modes = { DATA-USB = "USB", DATA-LSB = "LSB", DATA-FM = "FM" }
source = "full_manual"
verified = false

# ---------------------------------------------------------------------------
# Commands the driver uses for rig-model operations.
# ---------------------------------------------------------------------------
[commands]
read_frequency = { command = "03", source = "civ_common", verified = false }
read_mode = { command = "04", source = "civ_common", verified = false }
set_frequency = { command = "05", source = "civ_common", verified = false }
set_mode = { command = "06", source = "civ_common", verified = false }
# 25 / 26 with 00 = selected VFO, 01 = unselected VFO. Preferred over 03-06
# because they reach the unselected VFO without switching to it, which split
# operation needs.
vfo_frequency = { command = "25", source = "full_manual", verified = false }
vfo_mode = { command = "26", source = "full_manual", verified = false }
select_vfo_a = { command = "07 00", source = "civ_common", verified = false }
select_vfo_b = { command = "07 01", source = "civ_common", verified = false }
split = { command = "0F", off = 0x00, on = 0x01, source = "civ_common", verified = false }
# 1C 00: transmit status. 00 = receive, 01 = transmit.
# Writing this keys the radio: only the Agent's transmit path may use it
# (Principle XI).
ptt = { command = "1C 00", off = 0x00, on = 0x01, source = "full_manual", verified = false }

# ---------------------------------------------------------------------------
# Every setting the radio exposes over CI-V, read into the settings record:
# the menu items (command 1A 05 plus the item number, 0001 to 0216 on firmware
# 1.40), then the front-panel controls (each by its own command). Front-panel
# controls are as they are for the mode and VFO the radio is on now.
#
# `raw = true` keeps a setting as the bytes the radio sends, compared and put
# back as they are, where no source read says what the values mean.
# `write = false` means the Agent never changes it, whatever else is true:
# the CI-V and USB link settings (changing one could cut the Agent off) and
# the radio's clock.
# ---------------------------------------------------------------------------
