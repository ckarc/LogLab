# ---------------------------------------------------------------------------
# Requirements: settings a job can't work without. The Agent checks them,
# explains what's wrong, and offers to change only that setting, with the
# operator's approval (docs/station-agent-usb-radios.md, "Adapting to the
# radio"). A requirement can only offer to change a setting with write = true.
# ---------------------------------------------------------------------------
[[requirements]]
job = "control"
setting = "usb_serial_function"
accept = ["CI-V"]
explain = "The radio's USB serial port is set to RTTY Decode, so it can't be controlled over USB. Set USB Serial Function to CI-V in the radio's Connectors settings."

[[requirements]]
job = "digital_modes"
setting = "data_mod"
accept = ["USB", "MIC,USB"]
offer = "USB"
explain = "In data mode the radio takes transmit audio from somewhere other than USB, so programs like WSJT-X and VARA would transmit silence."

[[requirements]]
job = "computer_voice"
setting = "data_off_mod"
accept = ["USB", "MIC,USB"]
offer = "MIC,USB"
explain = "Outside data mode the radio doesn't take transmit audio from USB, so a program's voice keyer would transmit silence. MIC,USB keeps the microphone working too."
