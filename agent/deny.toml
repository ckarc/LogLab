# cargo-deny license gate for the Station Agent (CONSTITUTION.md, Licensing).
# `[licenses].allow` must stay identical to ALLOWED in
# engine/scripts/check_licenses.py; an Engine test enforces that.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "PSF-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The Agent itself is AGPL-3.0-only and unpublished; check only its dependencies.
[licenses.private]
ignore = true
