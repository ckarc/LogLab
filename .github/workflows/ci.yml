# Merge gates (CONSTITUTION.md, Development Workflow). Job names are the status
# check names that branch protection on `main` requires — rename a job only
# together with the branch protection settings.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  engine:
    name: Engine (type check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    # The storage tests run against a real PostgreSQL, the same major version
    # as the Engine's deployment target; they fail, never skip, without it.
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: loglab
          POSTGRES_PASSWORD: loglab-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loglab"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: loglab
      PGPASSWORD: loglab-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install locked environment
        run: uv sync --locked
      - name: PostgreSQL client library (libpq) and server
        run: |
          uv run python -c "import psycopg; print('libpq', psycopg.pq.version())"
          uv run python -c "import psycopg; print(psycopg.connect('dbname=postgres').info.server_version)"
      - name: Format check
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Strict type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  agent:
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
      - name: Format check
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build (warnings are errors)
        run: cargo build --locked --all-targets
      - name: Tests
        run: cargo test --locked
      - name: Run
        run: cargo run --locked
      # The Windows Agent, kept for download from this run's page, so it can
      # be tried on a Windows computer with no Rust installed. Only after
      # every check above has passed; it changes no gate.
      - name: Release build for download (Windows)
        if: matrix.os == 'windows-latest'
        # RUSTFLAGS set here replaces agent/.cargo/config.toml's rustflags, so
        # the C runtime is linked statically here too: the download then runs
        # on a computer with no Visual C++ runtime installed.
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
        run: cargo build --locked --release
      - name: Keep the Windows Agent for download
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loglab-agent-windows
          path: agent/target/release/loglab-agent.exe
          if-no-files-found: error
          retention-days: 30

  licenses:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every source file carries the license notice
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -n 5 "$file" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only'; then
              echo "::error file=$file::missing 'SPDX-License-Identifier: AGPL-3.0-only' in the first five lines"
              missing=1
            fi
          done < <(git ls-files '*.py' '*.rs' '*.toml' '*.yml' '*.yaml')
          exit "$missing"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Engine dependency licenses
        working-directory: engine
        run: |
          uv sync --locked
          uv run python scripts/check_licenses.py
      - name: Install pinned Rust toolchain
        working-directory: agent
        run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - name: Agent dependency licenses
        working-directory: agent
        run: cargo deny --locked check licenses
